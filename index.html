<html>
  <head>
    <link rel="stylesheet" href="style.css">
    <title>Parcel Sandbox</title>
    <meta charset="UTF-8" />
  </head>

  <body>
    <!-- Кнопки переключения языка сверху слева -->
    <div class="lang-switcher">
      <button id="lang-ru" class="lang-btn">RU</button>
      <span class="lang-divider">|</span>
      <button id="lang-en" class="lang-btn">EN</button>
    </div>

    <!-- Добавили id для динамической смены текста -->
    <h1 id="main-title">Приветствую!</h1>
    <h2 id="main-subtitle">Здесь вы можете ознакомиться с моими проектами или связаться со мной по следующим ссылкам:</h2>
    
    <div class="container">
      <!-- Ссылка на Telegram -->
      <a href="https://t.me/Fendyar_Club" target="_blank" class="icon-link">
        <div class="icon-container">
          <span class="icon-circle"></span>
          <span class="icon-text">
            <i class="icon-box" id="telegram"></i>
          </span>
        </div>
      </a>

      <!-- Ссылка на Pinterest -->
      <a href="https://pinterest.com/ignatvoylov/" target="_blank" class="icon-link">
        <div class="icon-container">
          <span class="icon-circle"></span>
          <span class="icon-text">
            <i class="icon-box" id="pinterest"></i>
          </span>
        </div>
      </a>

      <!-- Ссылка на Discord -->
      <a href="https://discord.com/users/668531509354954798" target="_blank" class="icon-link">
        <div class="icon-container">
          <span class="icon-circle"></span>
          <span class="icon-text">
            <i class="icon-box" id="discord"></i>
          </span>
        </div>
      </a>

      <!-- Ссылка на Reddit -->
      <a href="https://reddit.com/user/Ignat_Voylov/" target="_blank" class="icon-link">
        <div class="icon-container">
          <span class="icon-circle"></span>
          <span class="icon-text">
            <i class="icon-box" id="reddit"></i>
          </span>
        </div>
      </a>

      <!-- Ссылка на Github -->
      <a href="https://github.com/Ignat-Voylov" target="_blank" class="icon-link">
        <div class="icon-container">
          <span class="icon-circle"></span>
          <span class="icon-text">
            <i class="icon-box" id="github"></i>
          </span>
        </div>
      </a>

      <!-- Ссылка на Instagram -->
      <a href="https://instagram.com/ignat.voylov" target="_blank" class="icon-link">
        <div class="icon-container">
          <span class="icon-circle"></span>
          <span class="icon-text">
            <i class="icon-box" id="instagram"></i>
          </span>
        </div>
      </a>
      
    </div>

<script type="module">
  import { 
    getPinterestIcon, 
    getTelegramIcon, 
    getDiscordIcon, 
    getRedditIcon,
    getGitHubIcon,
    getInstagramIcon,
    sayHello 
  } from 'https://unpkg.com/weblibrary-by-yougiroman@1.0.3/index.js';

  // Словарь с переводами
  const translations = {
    ru: {
      title: "Приветствую!",
      subtitle: "Здесь вы можете ознакомиться с моими проектами или связаться со мной по следующим ссылкам:"
    },
    en: {
      title: "Welcome!",
      subtitle: "Here you can check out my projects or contact me via the following links:"
    }
  };

  // Функция применения перевода на странице
  function applyLanguage(lang) {
    document.getElementById('main-title').innerText = translations[lang].title;
    document.getElementById('main-subtitle').innerText = translations[lang].subtitle;

    // Подсвечиваем активную кнопку переключателя
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`lang-${lang}`).classList.add('active');
  }

  // Функция определения стартового языка
  function getInitialLanguage() {
    // 1. Проверяем, менял ли пользователь язык вручную ранее
    const savedLang = localStorage.getItem('user-lang');
    if (savedLang && (savedLang === 'ru' || savedLang === 'en')) {
      return savedLang;
    }

    // 2. Если нет, определяем язык его системы/браузера
    const browserLang = navigator.language || navigator.userLanguage || 'en';
    
    // Список славянских кодов языков (ru, uk, be)
    const slavicLanguages = ['ru', 'uk', 'be'];
    const primarySubtag = browserLang.split('-')[0].toLowerCase(); // ИСПРАВЛЕНО: добавили [0] перед toLowerCase()

    if (slavicLanguages.includes(primarySubtag)) {
      return 'ru';
    } else {
      return 'en';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    console.log(sayHello("Создатель"));

    // Инициализируем язык при загрузке страницы
    const currentLang = getInitialLanguage();
    applyLanguage(currentLang);

    // Вешаем обработчики кликов на кнопки переключения
    document.getElementById('lang-ru').addEventListener('click', () => {
      localStorage.setItem('user-lang', 'ru');
      applyLanguage('ru');
    });

    document.getElementById('lang-en').addEventListener('click', () => {
      localStorage.setItem('user-lang', 'en');
      applyLanguage('en');
    });

    // Рендерим ваши иконки из библиотеки
    document.getElementById('pinterest').innerHTML = getPinterestIcon(48, '#E60023');
    document.getElementById('telegram').innerHTML = getTelegramIcon(48, '#24A1DE');
    document.getElementById('discord').innerHTML = getDiscordIcon(48, '#5865F2');
    document.getElementById('reddit').innerHTML = getRedditIcon(48, '#FF4500');
    document.getElementById('github').innerHTML = getGitHubIcon(48, '#181717');
    document.getElementById('instagram').innerHTML = getInstagramIcon(48, '#E1306C');
  });
</script>
  </body>
</html>
